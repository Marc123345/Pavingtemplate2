<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A1 Paving">
  <title>A1 Paving</title>
  <defs>
    <linearGradient id="psc-asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2C34"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="psc-strip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3B3B44"/>
      <stop offset="1" stop-color="#20202A"/>
    </linearGradient>
    <clipPath id="psc-badge">
      <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="13.5"/>
    </clipPath>
  </defs>

  <!-- asphalt badge -->
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="13.5" fill="url(#psc-asphalt)"/>

  <g clip-path="url(#psc-badge)">
    <!-- driveway in perspective -->
    <path d="M15 53 L27.5 15 H36.5 L49 53 Z" fill="url(#psc-strip)"/>
    <!-- wet-look sheen down the fresh coat -->
    <path d="M15 53 L27.5 15 H31 L24 53 Z" fill="#FFFFFF" opacity=".07"/>
    <!-- centre line, tapering to the horizon -->
    <g fill="#F0B429">
      <rect x="29.6" y="46.5" width="4.8" height="5" rx=".7"/>
      <rect x="30" y="37.5" width="4" height="4.1" rx=".6"/>
      <rect x="30.4" y="29.8" width="3.2" height="3.3" rx=".5"/>
      <rect x="30.7" y="23.4" width="2.6" height="2.6" rx=".4"/>
      <rect x="30.95" y="18.2" width="2.1" height="2" rx=".35"/>
    </g>
  </g>

  <!-- safety-amber seal -->
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="13.5" fill="none" stroke="#F0B429" stroke-width="3.5"/>
</svg>
